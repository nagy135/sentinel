name: Publish Docker image

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.check.outputs.eligible }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version tag is on master
        id: check
        shell: bash
        run: |
          echo "eligible=false" >> "$GITHUB_OUTPUT"

          tag="${GITHUB_REF#refs/tags/}"
          if [[ ! "$tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Skipping non-version tag: $tag"
            exit 0
          fi

          git fetch origin master --no-tags
          tag_commit="$(git rev-list -n 1 "$GITHUB_REF")"
          if git merge-base --is-ancestor "$tag_commit" origin/master; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping tag because its commit is not on master: $tag"
          fi

  verify:
    needs: release-check
    if: needs.release-check.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test:production
      - run: bun run test:docker
      - run: SENTINEL_SKIP_DOCKER_BUILD=1 bun run test:docker:host

  publish:
    needs: [release-check, verify]
    if: needs.release-check.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: viktornagy
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          tags: |
            viktornagy/sentinel:${{ github.ref_name }}
            viktornagy/sentinel:latest
